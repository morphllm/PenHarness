# One control-plane machine. Worker Machines are created per paid engagement by fleet.py.
app = "morph-penharness-control-preflight"
primary_region = "iad"

[build]
  dockerfile = "fly/Dockerfile"

[env]
  PENHARNESS_CONTROL_PLANE = "1"
  PENHARNESS_BIND = "::"
  PENHARNESS_PORT = "8080"
  PENHARNESS_BROKER_PORT = "8081"
  # FLY_PRIVATE_IP supplies the exact private broker bind address at runtime.
  PENHARNESS_STATE_ROOT = "/data/engagements"
  PENHARNESS_OIDC_AUDIENCE = "https://penharness.morphllm.com"
  VERCEL_ENVIRONMENT = "production"
  VERCEL_TEAM_SLUG = "autoinfra"
  VERCEL_PROJECT_NAME = "morph"
  VERCEL_OIDC_ISSUER = "https://oidc.vercel.com/autoinfra"
  # Keep disabled until the deny-by-default worker-egress preflight passes.
  HACK_ME_LAUNCH_ENABLED = "0"
  HACK_ME_FLEET_BACKEND = "fly"
  FLY_APP = "morph-penharness-hack-me-test"
  HACK_ME_CONTROL_FLY_APP = "morph-penharness-control-preflight"
  HACK_ME_MODEL_BROKER_ORIGIN = "http://morph-penharness-control-preflight.internal:8081"
  HACK_ME_BROKER_TTL_SECONDS = "21600"
  HACK_ME_EGRESS_ENFORCED = "1"
  HACK_ME_EGRESS_PROXY_URL = "http://127.0.0.1:3128"
  HACK_ME_WORKER_IMAGE = "registry.fly.io/morph-penharness-hack-me-test:latest"
  HACK_ME_MORPH_BASE_URL = "https://api.morphllm.com"
  HACK_ME_WORKERS = "4"
  HACK_ME_MAX_ACTIVE = "16"
  HACK_ME_MAX_RUNTIME_SECONDS = "21600"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["app"]
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"
    method = "get"
    path = "/health"

[[mounts]]
  source = "hack_me_engagements"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
